<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Prestige - Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-black">
        <div class="container-fluid ">
            <a class="navbar-brand fs-4 fw-medium p-1 text-warning ms-5" href="#">Eventos Prestige</a>
          <div class="collapse navbar-collapse d-flex justify-content-end" id="navbarNav">
            <ul class="navbar-nav fs-4 fw-medium p-1">
              <li class="nav-item">
                <a class="nav-link text-warning" href="./index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-primary text-opacity-75" href="./clientes.html">Clientes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-primary text-opacity-75" href="./eventos.html">Eventos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-primary text-opacity-75" href="./salones.html">Salones</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-4">
        <h1 class="fs-4 fw-medium p-4" id="tituloFormulario">Crear Cliente</h1>

        <form class="row g-3 shadow p-3 mb-5 bg-body-tertiary rounded" id="formularioCliente">
            <div class="col-md-4">
                <input type="hidden" id="idCliente" name="idCliente">

              <label for="nombreCliente" class="form-label">Nombre: </label>
              <input type="text" class="form-control" id="nombreCliente" name="nombreCliente" required maxlength="100">
            </div>
            <div class="col-md-4">
              <label for="apellidoCliente" class="form-label">Apellido: </label>
              <input type="text" class="form-control" id="apellidoCliente" name="apellidoCliente" required maxlength="100">
            </div>
            <div class="col-md-4">
              <label for="telefonoCliente" class="form-label">Telefono: </label>
                <input type="tel" class="form-control" id="telefonoCliente" name="telefonoCliente" required maxlength="15">
            </div>
            <div class="col-md-6">
              <label for="emailCliente" class="form-label">Email: </label>
              <input type="email" class="form-control" id="emailCliente" name="emailCliente" required maxlength="100">
            </div>
            <div class="col-md-3">
              <label for="direccionCliente" class="form-label">Direccion: </label>
              <input type="text" class="form-control" id="direccionCliente" required maxlength="200">
            </div>
            <div class="col-12">
              <button class="btn btn-primary" type="submit" id="btnCliente">Guardar</button>
              <button class="btn btn-secondary" type="button" id="btnCancelarCliente">Cancelar</button>
            </div>
          </form>

          <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre del Cliente</th>
                            <th>Apellido</th>
                            <th>Telefono</th>
                            <th>Email</th>
                            <th>Direccion</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCliente">

                    </tbody>
                </table>
            </div>
        </div>
      </main>

    <script type="module" src="./js/controllers/clientesController.js"></script>
</body>
</html>
