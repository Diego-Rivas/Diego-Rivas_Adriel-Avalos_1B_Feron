<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Prestige - Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-black">
        <div class="container-fluid ">
            <a class="navbar-brand fs-4 fw-medium p-1 text-warning ms-5" href="#">Eventos Prestige</a>
          <div class="collapse navbar-collapse d-flex justify-content-end" id="navbarNav">
            <ul class="navbar-nav fs-4 fw-medium p-1">
              <li class="nav-item">
                <a class="nav-link text-warning" href="./index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-primary text-opacity-75" href="./clientes.html">Clientes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-primary text-opacity-75" href="./eventos.html">Eventos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-primary text-opacity-75" href="./salones.html">Salones</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-4">
        <h1 class="fs-4 fw-medium p-4" id="tituloFormulario">Crear Evento</h1>

        <form class="row g-3 shadow p-3 mb-5 bg-body-tertiary rounded" id="formularioEvento">
            <div class="col-md-6">
                <input type="hidden" id="idEvento" name="idEvento">

              <label for="nombreEvento" class="form-label">Nombre del Evento: </label>
              <input type="text" class="form-control" id="nombreEvento" name="nombreEvento" required maxlength="100">
            </div>
            <div class="col-md-6">
              <label for="fechaEvento" class="form-label">Fecha del Evento: </label>
              <input type="date" class="form-control" id="fechaEvento" name="fechaEvento" required>
            </div>
            <div class="col-md-6">
              <label for="cantidadPersonasEvento" class="form-label">Cantidad de personas: </label>
                <input type="number" class="form-control" id="cantidadPersonasEvento" name="cantidadPersonasEvento" required step="1" min="1">
            </div>
            <div class="col-md-6">
                <label for="cantidadHorasEvento" class="form-label">Cantidad de Horas: </label>
                  <input type="number" class="form-control" id="cantidadHorasEvento" name="cantidadHorasEvento" required step="1" min="1">
              </div>

              <div class="col-md-6">
                <label for="selectClienteEvento" class="form-label">Cliente: </label>
                <select class="form-select" id="selectClienteEvento" required>
                    <option value="">Cargando clientes...</option>
                  </select>
              </div>

              <div class="col-md-6">
                <label for="selectSalonEvento" class="form-label">Salón: </label>
                <select class="form-select" id="selectSalonEvento" required>
                    <option value="">Cargando salones...</option>
                  </select>
              </div>

              <div class="col-md-6">
                <label for="selectEstadoEvento" class="form-label">Estado: </label>
                <select class="form-select" id="selectEstadoEvento" required>
                    <option value="CONFIRMADO">CONFIRMADO</option>
                    <option value="PENDIENTE">PENDIENTE</option>
                    <option value="CANCELADO">CANCELADO</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                  </select>
              </div>

              <div class="col-md-6">
                <label for="totalPagoEvento" class="form-label">Total a Pagar: </label>
                <input type="text" class="form-control fw-bold" id="totalPagoEvento" value="$0.00" readonly>
              </div>

            <div class="col-12">
              <button class="btn btn-primary" type="submit" id="btnEvento">Guardar</button>
              <button class="btn btn-secondary" type="button" id="btnCancelarEvento">Cancelar</button>
            </div>
          </form>

          <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre del Evento</th>
                            <th>Cliente</th>
                            <th>Salon</th>
                            <th>Fecha del Evento</th>
                            <th>Cantidad de Personas</th>
                            <th>Cantidad de Horas</th>
                            <th>Estado del Evento</th>
                            <th class="text-end">Total a Pagar</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEvento">

                    </tbody>
                </table>
            </div>
        </div>
      </main>

    <script type="module" src="./js/controllers/eventosController.js"></script>
</body>
</html>
